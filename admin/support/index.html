<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Priority Support | OrivenAI</title>
<link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<style>
  .sp-grid{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:16px;align-items:start}
  @media (max-width:760px){.sp-grid{grid-template-columns:1fr}}
  .sp-list{display:flex;flex-direction:column;gap:8px}
  .sp-item{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
  .sp-item[aria-current="true"]{border-color:var(--lime-line);background:var(--lime-soft)}
  .sp-item:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .sp-item b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-item span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:#0A0A0A;background:var(--warn);border-radius:999px;padding:1px 7px;vertical-align:1px}
  .sp-thread{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;margin:12px 0}
  .sp-msg{max-width:80%;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font-size:14px}
  .sp-msg.admin{align-self:flex-end;background:var(--lime-soft);border-color:var(--lime-line)}
  .sp-msg small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
  .sp-reply{display:flex;flex-direction:column;gap:8px}
  .sp-reply textarea{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);border-radius:12px;padding:10px 12px;font:14px var(--font);min-height:96px;resize:vertical}
  .sp-reply button{align-self:flex-end;border:0;cursor:pointer;min-height:42px;padding:0 20px;border-radius:999px;background:var(--lime);color:#0A0A0A;font:600 14px var(--font)}
  .sp-reply button[disabled]{opacity:.5;cursor:default}
  .sp-note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<!-- Priority Support inbox (owner only). Holds no data: every request goes to
     /api/support/admin/*, which verifies the session and the admin list
     (ADMIN_USER_IDS) on the server. -->
<div class="ad-wrap" id="spRoot">
  <div class="ad-gate"><h1>Loading…</h1></div>
</div>
<div class="ad-tip" id="spTip" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/admin-support.js"></script>
</body>
</html>
