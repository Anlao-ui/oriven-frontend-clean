<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Email campaigns | OrivenAI</title>
<link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<style>
  .cp-grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.cp-grid{grid-template-columns:1fr}}
  .cp-col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .cp-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
  .cp-row:last-child{border-bottom:0}
  .cp-row b{font-variant-numeric:tabular-nums}
  .cp-note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
  .cp-btn{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:40px;padding:0 16px;border-radius:999px;font:600 13.5px var(--font)}
  .cp-btn.primary{background:var(--lime);color:#0A0A0A;border-color:var(--lime)}
  .cp-btn[disabled]{opacity:.45;cursor:default}
  .cp-actions{display:flex;flex-wrap:wrap;gap:8px}
  .cp-frame{width:100%;height:760px;border:1px solid var(--line);border-radius:12px;background:#0A0A0A}
  .cp-input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:9px 10px;font:13.5px var(--font)}
  .cp-out{font:12.5px ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--ink-2);margin:0}
  .cp-badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line-2)}
  .cp-badge.live{background:var(--lime-soft);border-color:var(--lime-line);color:var(--lime)}
</style>
</head>
<body>
<!-- Owner-only email campaigns. Holds no data: everything comes from
     /api/admin/campaigns/*, which verifies the session and ADMIN_USER_IDS on
     the server. The real send also needs EMAIL_MODE=live,
     MARKETING_CAMPAIGN_APPROVED=<campaign id> on the server, the confirmation
     phrase and the reviewed eligible count. -->
<div class="ad-wrap" id="cpRoot"><div class="ad-gate"><h1>Loading…</h1></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/admin-campaigns.js"></script>
</body>
</html>
